[project]
name = "autodfem"
version = "0.1.0"
description = "Simple Residual Based FEM with Automatic Differentiation (through Dual Numbers), not for production use, built as a learning tool"
authors = [
    {name = "autodfem"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.17.1",
    "matplotlib>=3.10.8",
    "meshio>=5.3.5",
    "gmsh>=4.15.2"
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
